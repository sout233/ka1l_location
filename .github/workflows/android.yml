name: Android CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish APKs as a prerelease
        type: boolean
        default: false
      release_tag:
        description: New release tag (required when publishing manually)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: KailLocation
            project: .
          - name: KailLocationXposed
            project: KailLocationXposed
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.13846066' 'cmake;3.22.1'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Restore CI test signing key
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: ~/.android/kail-ci.keystore
          key: kail-ci-signing-${{ github.repository_id }}-${{ matrix.name }}-v1
      - name: Prepare CI signing certificate
        env:
          PROJECT_DIR: ${{ matrix.project }}
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/kail-ci.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/kail-ci.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -dname 'CN=Kail CI Test,O=Open Source,C=US' \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          if [ "$PROJECT_DIR" = '.' ]; then
            keytool -exportcert -keystore "$HOME/.android/kail-ci.keystore" \
              -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/kail-ci.der"
            python3 scripts/configure-signing-certificate.py "$RUNNER_TEMP/kail-ci.der"
          fi
      - name: Test and build release APK
        working-directory: ${{ matrix.project }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx4g -Dfile.encoding=UTF-8'
      - name: Sign and verify APK with CI test key
        env:
          PROJECT_DIR: ${{ matrix.project }}
          APK_NAME: ${{ matrix.name }}
        run: |
          mkdir -p "$HOME/.android" dist
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -f -p 4 "$PROJECT_DIR/app/build/outputs/apk/release/app-release-unsigned.apk" "dist/$APK_NAME-aligned.apk"
          "$tools/apksigner" sign --ks "$HOME/.android/kail-ci.keystore" \
            --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android \
            --out "dist/$APK_NAME.apk" "dist/$APK_NAME-aligned.apk"
          rm "dist/$APK_NAME-aligned.apk"
          "$tools/apksigner" verify --verbose "dist/$APK_NAME.apk"
          (cd dist && sha256sum "$APK_NAME.apk" > "$APK_NAME.apk.sha256")
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.name }}
          path: ${{ matrix.project }}/app/build/reports/tests/
          if-no-files-found: ignore

  release:
    name: Publish prerelease
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested APKs
        uses: actions/download-artifact@v4
        with:
          pattern: KailLocation*
          merge-multiple: true
          path: dist
      - name: Create prerelease with APKs and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="$RELEASE_TAG_INPUT"
          fi
          if [[ ! "$tag" =~ ^v[0-9][A-Za-z0-9._-]*$ ]]; then
            echo 'Release tag must start with v and a digit and contain only letters, digits, dots, underscores or hyphens.' >&2
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          无账号开源接口版：移除登录、会员支付与每日模拟次数限制，公告和 FAQ 支持自托管与离线回退。

          下载 KailLocation.apk 安装主程序；使用 Xposed 模式时另外安装 KailLocationXposed.apk。

          这是 CI 测试签名预发布版，不使用原作者的签名，无法直接覆盖安装原版。更换签名前请自行备份数据。CI 已执行单元测试与 APK 签名校验，尚未进行真机测试；百度地图等第三方服务仍需原有配置。

          This prerelease uses a CI test signing key, not a production signing key. APKs cannot replace differently signed installations. SHA-256 checksum files are included.
          NOTES
          printf '\nSource commit: %s\n' "$GITHUB_SHA" >> release-notes.md
          gh release create "$tag" dist/*.apk dist/*.sha256 \
            --repo "$GH_REPO" --target "$GITHUB_SHA" --prerelease \
            --title "Kail Location $tag (open edition)" --notes-file release-notes.md
